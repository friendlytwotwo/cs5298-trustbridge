# TrustBridge — 纯 EVM 对照实验（R3 目标 B）的 foundry 工程配置。
#
# 工具链事实（plan §2-1，容器内实跑）：forge 1.7.1 可用、solc 由容器自动获取
#（冒烟实录 `Solc 0.8.37` / `Compiler run successful!`）；宿主**无** forge，故
# build/deploy 全部在 multi-tools 容器内执行（run-contrast.sh 头注有引导命令）。
# anvil 从容器内可达 http://anvil:8545（宿主无端口映射，plan §2-2/§2-3）——
# 与 Lyquid 实例共享同一 sequencer，双方链上证据同链可比。

[profile.default]
# Escrow.sol 放在工程根目录（plan §0-#5 的文件路径），故 src = "."。
# forge 默认排除 out/、cache/、lib/，不会递归编译产物。
src = "."
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200

# solc 版本**不钉死**：容器内实际解析到 Solc 0.8.37（冒烟实录）。Escrow.sol 的
# pragma 为 ^0.8.24，任何 >=0.8.24 的 solc 均可编译；若需复现固定版本，在容器内
# 用 `forge build --use <ver>` 并回填此处。
