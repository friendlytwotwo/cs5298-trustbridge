[package]
name = "trustbridge"
version = "0.1.0"
edition = "2021"
description = "Committee-attested fulfillment trust layer for A2A deals on Lyquor (CS5298 final project)"

# Platform pin: the public ldk repo moves weekly (0.4 -> 0.7 in five weeks) and the
# crates.io `lyquid-llm` / `lyquid-flow` entries are name placeholders (v0.0.0), so ALL
# platform deps are git-pinned to the same tag. Do not upgrade without a team decision.
[dependencies]
# `features = ["ldk"]` mirrors lyquid-template/Cargo.toml verbatim: without it
# ldk v0.7.3 gates `pub mod method` / `pub mod runtime` / `pub use
# runtime::prelude` behind #[cfg(feature = "ldk")] (ldk lyquid/src/lib.rs:24-25,153-157),
# so state!/method/log!/prelude types do not exist at all. The feature pulls
# ldk's own optional deps (talc 5.0.3, ahash 0.8.12, hashbrown/lyquid-proc —
# ldk lyquid/Cargo.toml [features]); versions are the platform's choice, not
# ours. Git tag stays pinned at v0.7.3; no new crates.io direct deps.
# D7 版本对齐（2026-10-24 触发，证据 workflow-out/implementation.md）：devnet 节点
# （main-latest, LDK "0.8.2-dev"）托管层拒绝 v0.7.3 构建产物
# （IncompatibleLdk{image:"0.7.3", node:"0.8.2-dev"}，docker logs ldk-node-1 实测）。
# 目标 = 本地 ldk 克隆 v0.8.1（rev=fd575e8，F15；与 0.7.3 所用面逐字一致，
# implementation.md 登记对照）。语义仍是平台 pin，不是依赖浮动。
lyquid = { git = "https://github.com/lyquor-labs/ldk", rev = "fd575e88a920448e646f23968775e52982c5201c", features = ["ldk"] }
# W1-B2（S3 接线）：追加 features = ["ldk"] —— call_model 是 lyquid-llm 的
# #[cfg(feature = "ldk")] 项（lyquid-llm/src/lib.rs:458，default=[] 不含之），
# 官方 shopping-assistant 依赖行同款形态（shopping-assistant/Cargo.toml:11）。
# 同一 git pin、零新增 crates.io 依赖（方案"明示不动 Cargo.toml"理由为"零新
# 增依赖"，本行不新增依赖仅开官方 feature 门——偏离登记见 implementation.md）。
lyquid-llm = { git = "https://github.com/lyquor-labs/ldk", rev = "fd575e88a920448e646f23968775e52982c5201c", features = ["ldk"] }
# Re-export declaration, not a new third-party dep: serde_json 1.0.154 is
# already the locked transitive dependency of the git-pinned ldk crates
# (Cargo.lock). Version strategy: caret "1" only — never bump past what the
# platform pins pull in; revisit the wasm/json story at W1 (assessor.rs:75).
serde_json = "1"
# Re-export declaration, not a new third-party dep: serde 1.0.229 is already
# the locked transitive dependency (Cargo.lock:668, via serde_json/serde_derive
# of the git-pinned ldk crates). default-features=false + derive only.
# W1 conclusion (was SPIKE(W1)): ldk's own CallContext/LyteLog are serde-based
# (ldk lyquid/src/lib.rs:48-50,161), so serde+derive composes with the
# platform as-is; the wasm/json story needs no further serde config change.
serde = { version = "1", default-features = false, features = ["derive"] }

[dev-dependencies]
lyquid-test = { git = "https://github.com/lyquor-labs/ldk", rev = "fd575e88a920448e646f23968775e52982c5201c" }

# W1 conclusion (was SPIKE(W1)): verbatim match with lyquid-template/Cargo.toml
# [lib] — no drift. rlib keeps `cargo test` working on the pure core without a
# wasm build; cdylib is what shaker deploys.
[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
